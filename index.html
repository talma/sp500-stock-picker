<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&amp;P 500 Toolkit</title>
<style>
  :root {
    --paper: #f7f3e8; --paper-dark: #efe9d8; --ink: #1c1b16;
    --ink-soft: #55524a; --rule: #8b8674; --accent: #7a1f1f;
    --good: #2e6b30; --bad: #9c2b2b;
    --rail: 224px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: Georgia, "Times New Roman", serif;
         display: flex; overflow: hidden; }

  /* ---------- left tab rail ---------- */
  .rail { width: var(--rail); flex: 0 0 var(--rail); height: 100%;
      background: var(--paper-dark); border-right: 3px double var(--rule);
      display: flex; flex-direction: column; transition: flex-basis .15s,
      width .15s; }
  body.collapsed { --rail: 58px; }
  .brand { padding: 16px 14px 12px; border-bottom: 3px double var(--rule); }
  .brand .title { font-size: 15px; letter-spacing: 2px;
      text-transform: uppercase; line-height: 1.25; }
  .brand .sub { font-size: 11px; color: var(--ink-soft); font-style: italic;
      margin-top: 4px; }
  body.collapsed .brand .title, body.collapsed .brand .sub,
  body.collapsed .tab .label, body.collapsed .tab .hint,
  body.collapsed .rail-foot { display: none; }

  .tabs { list-style: none; margin: 0; padding: 8px 0; flex: 1;
      overflow-y: auto; }
  .tab { display: flex; gap: 10px; align-items: baseline; width: 100%;
      text-align: left; background: none; border: none; cursor: pointer;
      font-family: inherit; color: var(--ink); padding: 11px 14px;
      border-left: 4px solid transparent; }
  .tab:hover { background: rgba(122, 31, 31, .07); }
  .tab[aria-selected="true"] { background: var(--paper);
      border-left-color: var(--accent); }
  .tab .num { font-family: "Courier New", Courier, monospace; font-size: 12px;
      color: var(--ink-soft); }
  .tab[aria-selected="true"] .num { color: var(--accent); }
  .tab .label { font-size: 15px; letter-spacing: .5px; display: block; }
  .tab .hint { display: block; font-size: 11px; color: var(--ink-soft);
      font-style: italic; margin-top: 2px; }
  .tab .warn { color: var(--bad); font-style: normal;
      font-family: "Courier New", Courier, monospace; }
  body.collapsed .tab { justify-content: center; padding: 13px 0; }

  .rail-foot { padding: 10px 14px; border-top: 1px solid var(--rule);
      font-size: 11px; color: var(--ink-soft);
      font-family: "Courier New", Courier, monospace; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
      background: var(--ink-soft); margin-right: 5px; }
  .dot.up { background: var(--good); } .dot.down { background: var(--bad); }
  .collapse-btn { width: 100%; background: none; border: none;
      border-top: 1px solid var(--rule); cursor: pointer; padding: 9px 0;
      font-family: "Courier New", Courier, monospace; font-size: 14px;
      color: var(--ink-soft); }
  .collapse-btn:hover { background: rgba(122, 31, 31, .07); }

  /* ---------- panels ---------- */
  .stage { flex: 1; height: 100%; position: relative; min-width: 0; }
  .panel { position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: block; background: var(--paper); }
  .panel[hidden] { display: none; }
  .placeholder { position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center; text-align: center;
      padding: 40px; color: var(--ink-soft); font-style: italic; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    .rail, body.collapsed .rail { width: 100%; flex: 0 0 auto; height: auto;
        border-right: none; border-bottom: 3px double var(--rule); }
    .brand, .rail-foot, .collapse-btn { display: none; }
    .tabs { display: flex; padding: 0; overflow-x: auto; }
    .tab { border-left: none; border-bottom: 4px solid transparent;
        white-space: nowrap; }
    .tab[aria-selected="true"] { border-bottom-color: var(--accent); }
    .tab .hint { display: none; }
  }
</style>
</head>
<body>
  <nav class="rail" aria-label="Tools">
    <div class="brand">
      <div class="title">S&amp;P 500<br>Toolkit</div>
      <div class="sub" id="brand-sub"></div>
    </div>
    <ul class="tabs" id="tabs" role="tablist" aria-orientation="vertical"></ul>
    <div class="rail-foot" id="server-status">
      <span class="dot"></span>checking server…</div>
    <button class="collapse-btn" id="collapse-btn"
            title="Collapse the tab rail">&#9664;&#9664;</button>
  </nav>

  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">Loading…</div>
  </div>

<script>
"use strict";

// Each tool stays a standalone page and is shown here in its own frame.
// That is deliberate: ledger.html is still reachable and linkable on its own,
// and the three tools have overlapping element IDs and global names (`$`,
// `esc`, `api`, `#status`, ...). Inlining them into one document would mean
// either maintaining the Ledger twice or renaming every collision in ~2,800
// lines of working JS — a frame per tool keeps each one exactly as it ships.
const TOOLS = [
  {id: "ledger", src: "ledger.html", label: "The Ledger",
   hint: "Backtest &amp; stock picker"},
  {id: "screener", src: "screener.html", label: "Screening Desk",
   hint: "Find established names", needsServer: true},
  {id: "analyzer", src: "stock_analyzer.html", label: "Equity Dossier",
   hint: "Analyze one ticker", needsServer: true},
];
const DEFAULT_TAB = TOOLS[0].id;

const $ = id => document.getElementById(id);
const frames = new Map();       // tool id -> iframe, created on first open
let activeId = null;

/* ---------- routing ----------
   The hash carries the tool and, optionally, that tool's own query string:
   #analyzer?ticker=AAPL. Deep links therefore survive a reload, and a child
   asking to open a sibling (screener -> analyzer) lands in the same shape. */

function parseHash(hash) {
  const raw = (hash || "").replace(/^#/, "");
  if (!raw) return {id: null, search: ""};
  const cut = raw.indexOf("?");
  return cut === -1
    ? {id: raw, search: ""}
    : {id: raw.slice(0, cut), search: raw.slice(cut)};
}

const toolById = id => TOOLS.find(tool => tool.id === id);

/* ---------- frames ---------- */

function frameFor(tool, search) {
  let frame = frames.get(tool.id);
  const wanted = tool.src + (search || "");
  if (!frame) {
    frame = document.createElement("iframe");
    frame.className = "panel";
    frame.title = tool.label;
    // Loaded on first open, then kept alive: switching tabs must not discard
    // a filled-in screen or a rendered dossier, and must not re-run the
    // fetches that produced them.
    frame.src = wanted;
    frames.set(tool.id, frame);
    $("stage").appendChild(frame);
    return frame;
  }
  // An explicit deep link (a ticker handed over from the screener) must win
  // over whatever the frame is already showing; a bare tab click must not.
  if (!search) return frame;
  let current = null;
  try { current = frame.contentWindow ? frame.contentWindow.location : null; }
  catch { current = null; }
  if (current && current.pathname.endsWith(tool.src)) {
    if (current.search !== search) current.replace(wanted);
  } else if (!frame.src.endsWith(wanted)) {
    // Still on about:blank because the first load is in flight — the src
    // attribute is the only reliable handle at that point, and re-pointing
    // it cannot leave a stale ticker behind.
    frame.src = wanted;
  }
  return frame;
}

function show(id, {search = "", updateHash = true} = {}) {
  const tool = toolById(id) || toolById(DEFAULT_TAB);
  $("placeholder").hidden = true;
  const frame = frameFor(tool, search);
  for (const [otherId, otherFrame] of frames)
    otherFrame.hidden = otherId !== tool.id;
  activeId = tool.id;

  for (const button of $("tabs").querySelectorAll(".tab"))
    button.setAttribute("aria-selected",
      String(button.dataset.tab === tool.id));
  document.title = `${stripTags(tool.label)} — S&P 500 Toolkit`;
  $("brand-sub").textContent = stripTags(tool.hint);
  if (updateHash) {
    const next = "#" + tool.id + (search || "");
    if (location.hash !== next) history.replaceState(null, "", next);
  }
  // Focus the panel so the tool's own keyboard handling (Enter to analyze)
  // works immediately after a tab switch instead of after a stray click.
  frame.focus();
}

const stripTags = html => html.replace(/&amp;/g, "&");

/* ---------- shell API used by the framed tools ---------- */
// Same-origin, so a child can call this directly. Children feature-detect it
// and fall back to a normal link when opened outside the shell.
window.appShell = {
  tools: TOOLS.map(tool => tool.id),
  open(id, params) {
    if (!toolById(id)) return false;
    const search = params && Object.keys(params).length
      ? "?" + new URLSearchParams(params) : "";
    show(id, {search});
    return true;
  },
};

/* ---------- server reachability ---------- */
// The Ledger reads CSVs and works anywhere, including GitHub Pages. The other
// two need analyze_server.py, so say so up front rather than letting the user
// meet "Cannot reach the API" inside a tab.
async function checkServer() {
  const status = $("server-status");
  if (location.protocol === "file:") {
    return markServer(status, false,
      "file:// — run analyze_server.py", "opened from disk");
  }
  try {
    const response = await fetch("/api/analyzed", {cache: "no-store"});
    if (!response.ok) throw new Error(String(response.status));
    markServer(status, true, "analyze_server.py up");
  } catch {
    markServer(status, false, "no analysis server",
               "needs analyze_server.py");
  }
}

function markServer(status, up, text, tabNote) {
  status.innerHTML =
    `<span class="dot ${up ? "up" : "down"}"></span>${text}`;
  if (up || !tabNote) return;
  for (const tool of TOOLS.filter(t => t.needsServer)) {
    const hint = $("tabs")
      .querySelector(`.tab[data-tab="${tool.id}"] .hint`);
    if (hint) hint.innerHTML = `<span class="warn">${tabNote}</span>`;
  }
}

/* ---------- wiring ---------- */

$("tabs").innerHTML = TOOLS.map((tool, index) => `
  <li role="presentation">
    <button class="tab" role="tab" type="button" data-tab="${tool.id}"
            aria-selected="false" title="${stripTags(tool.label)}">
      <span class="num">${index + 1}</span>
      <span><span class="label">${tool.label}</span>
        <span class="hint">${tool.hint}</span></span>
    </button>
  </li>`).join("");

$("tabs").addEventListener("click", event => {
  const button = event.target.closest(".tab");
  if (button) show(button.dataset.tab);
});

// role="tab" carries the expectation that arrows move between tabs; without
// it the rail is reachable by keyboard but does not behave like a tablist.
$("tabs").addEventListener("keydown", event => {
  const step = {ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1}[
    event.key];
  if (!step) return;
  event.preventDefault();
  // Move relative to the *focused* tab, not the selected one: after tabbing
  // into the rail those differ, and stepping from the selection would jump
  // somewhere the user is not looking.
  const focused = event.target.closest(".tab");
  const fromId = focused ? focused.dataset.tab : activeId;
  const index = TOOLS.findIndex(tool => tool.id === fromId);
  const next = TOOLS[(index + step + TOOLS.length) % TOOLS.length];
  show(next.id);
  $("tabs").querySelector(`.tab[data-tab="${next.id}"]`).focus();
});

$("collapse-btn").addEventListener("click", () => {
  const collapsed = document.body.classList.toggle("collapsed");
  $("collapse-btn").innerHTML = collapsed ? "&#9654;&#9654;" : "&#9664;&#9664;";
  $("collapse-btn").title = collapsed ? "Expand the tab rail"
                                      : "Collapse the tab rail";
});

window.addEventListener("hashchange", () => {
  const {id, search} = parseHash(location.hash);
  // Ignore the hash we just wrote ourselves; only react to real navigation.
  if (id && (id !== activeId || search))
    show(id, {search, updateHash: false});
});

const initial = parseHash(location.hash);
show(initial.id || DEFAULT_TAB, {search: initial.search});
checkServer();
</script>
</body>
</html>
